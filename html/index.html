<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/aside.css">
    <link rel="stylesheet" href="../css/popup.css">
    <link rel="stylesheet" href="../css/sidewallet.css">
    <title>Financeiro</title>
</head>

<body>
    <aside class="aside_profile">
        <div class="profile_content">
            <div class="user_profile">
                <div class="icon_profile icon">
                    <img src="../img/profile_icons/hornet.png" alt="" srcset="">
                </div>
                <p>Felipe</p>
            </div>
            <div class="line"></div>
            <nav>
                <div class="features">
                    <div class="icon_feature">
                        <img src="../img/icons/kindness.png" alt="" srcset="">
                    </div>
                    <p class="feature_name">bla bla</p>
                </div>
                <div class="features">
                    <div class="icon_feature">
                        <img src="../img/icons/bar-chart.png" alt="" srcset="">
                    </div>
                    <p class="feature_name">bla bla bla</p>
                </div>
                <div class="features">
                    <div class="icon_feature">
                        <img src="../img/icons/trophy.png" alt="" srcset="">
                    </div>
                    <p class="feature_name">bla bla</p>
                </div>
                <div class="features">
                    <div class="icon_feature">
                        <img src="../img/icons/recycle-bin.png" alt="" srcset="">
                    </div>
                    <p class="feature_name">bla</p>
                    
                </div>
            </nav>

            <div class="pontos">
                <p>pontos </p>
            </div>
        </div>
    </aside>
    <main>

        <section class="finance_elements">
            <div class="finance_charts chart">
                <div class="icon_charts">
                    <img src="../img/icons/spending.png" alt="" srcset="">
                </div>
                <p>Salario</p>
            </div>
            <div class="finance_charts chart">
                <div class="icon_charts">
                    <img src="../img/icons/spending.png" alt="">
                </div>
                <p>Investimentos</p>
            </div>
            <div class="finance_charts chart">
                <div class="icon_charts">
                    <img class="puts" alt="" src="../img/icons/spending.png">
                </div>
                <p>Gastos</p>
            </div>
        </section>
        <section class="finance_transaction">
            <div class="graphics">
                <p>opa</p>
            </div>
            <!-- <div class="out ">
                <div class="title">
                    <p>Gastos</p>
                </div>
                <div class="add">
                    <button class="btn_out  btn" type="button ">Adicionar</button>
                </div>
            </div>
            <div class="in">
                <div class="title">
                    <p>Investimentos</p>
                </div>
                <div class="add">
                    <button class="btn_in btn" type="button">Adicionar</button>
                </div> -->
        </section>
        <div class="popup disable">
            <div class="content_popup">
                <div class="button_close">
                    <p class="close">X</p>
                </div>
                <!-- gasto -->
                <form method="get" class="content_in disable" action="" id="form">
                    <div class="contentInfo">
                        <span class="subtitles">Digite o que foi gasto</span>
                        <input type="text" name="spend" id="spend" placeholder="Exemplo: sportify" class="insertion">
                        <label for="">Valor gasto</label>
                        <input type="number" name="cashout" id="" class="cashout insertion">
                        <label for="gastos" class="subtitles">Escolha tipo de gasto</label>
                        <select name="method" id="metodo" class="metodo insertion">   
                            <option value="Card">cartão</option>
                            <option value="Mensalidade">Mensalidade</option>
                            <option value="Pix">Pix</option>
                        </select>
                        <input type="submit" value="ENVIAR" class="submit insertion">
                    </div>
                </form>

                <!-- investimento -->
                <form method="get" class="content_in disable" action="" id="form_in">
                    <span class="subtitles">Digite quanto foi investido</span>
                    <input type="text" name="invest" id="invest" placeholder="Quanto foi investido" class="insertion">
                    <label for="gastos">valor investido</label>
                    <select name="method" id="metodo" class="metodo insertion">   
                        <option value="poupanca">poupança/caixinha</option>
                        <option value="stocks">Ações</option>
                        <option value="cdb">CDB</option>
                    </select>
                    <input type="submit" value="ENVIAR" class="submit insertion">
                </form>
            </div>
        </div>
    </main>
    <aside class="aside_wallet">
        <div class="content_wallet">
            <div class="icon_wallet ">
                <div class="img_wallet"><img src="" alt="" srcset=""></div>
            </div>
            <p class="">Usando: </p>
            
            <div class="samples_content">
                <div class="samples">
                    <p>ola</p>
                </div>
            </div>
        </div>
    </aside>
</body>
<script src="../js/code.js"></script>
<script src="../js/modal.js"></script>

</html>
