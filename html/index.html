<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/aside.css">
    <link rel="stylesheet" href="../css/popup.css">
    <link rel="stylesheet" href="../css/sidewallet.css">
    <title>Financeiro</title>
</head>

<body>
    <aside>
        <div class="profile_content">
            <div class="icon_profile icon">
                <img src="../img/profile_icons/hornet.png" alt="" srcset="">
            </div>
            <div class="nome">Felipe</div>
            <nav>
                <div class="features">
                    <div class="icon_feature">
                        <img src="../img/icons/kindness.png" alt="" srcset="">
                    </div>

                </div>
                <div class="features">
                    <div class="icon_feature">
                        <img src="../img/icons/bar-chart.png" alt="" srcset="">
                    </div>

                </div>
                <div class="features">
                    <div class="icon_feature">
                        <img src="../img/icons/trophy.png" alt="" srcset="">
                    </div>

                </div>
                <div class="features">
                    <div class="icon_feature">
                        <img src="../img/icons/recycle-bin.png" alt="" srcset="">
                    </div>

                </div>
            </nav>

            <div class="pontos">
                <p>pontos </p>
            </div>
        </div>
    </aside>
    <main>

        <section class="finance_elements">
            <div class="finance_charts chart">
                <p>Salario</p>
                <div class="icon_charts">
                    <img src="../img/icons/spending.png" alt="" srcset="">
                </div>
                <p>description</p>

            </div>
            <div class="finance_charts chart">
                <p>Gastos</p>
                <div class="icon_charts">
                    <img src="../img/icons/spending.png" alt="">
                </div>
                <p>description</p>
            </div>
            <div class="finance_charts chart">
                <p>Investimentos</p>
                <div class="icon_charts">
                    <img class="puts" alt="" src="../img/icons/spending.png">
                </div>
                <p>description</p>
            </div>
        </section>
        <section class="finance_transaction">
            <div class="out ">
                <div class="title">
                    <p>Gastos</p>
                </div>
                <div class="add">
                    <button class="btn_out  btn" type="button ">Adicionar</button>
                </div>
            </div>
            <div class="in">
                <div class="title">
                    <p>Investimentos</p>
                </div>
                <div class="add">
                    <button class="btn_in btn" type="button">Adicionar</button>
                </div>
        </section>
        <div class="popup disable">
            <div class="content_popup">
                <div>
                    <p class="close">X</p>
                </div>
                <form method="get" class="content_in disable" action="" id="form">
                    <input type="text" name="spend" id="spend" placeholder="O que foi o gasto">
                    <label for="gastos">Escolha tipo de gasto</label>

                    <select name="method" id="metodo" class="metodo">   
                                <option value="Card">cartão</option>
                                <option value="Mensalidade">Mensalidade</option>
                                <option value="Pix">Pix</option>
                        </select>

                    <input type="submit" value="enviar" class="submit">
                </form>
                <form method="get" class="content_in disable" action="" id="form_in">
                    <input type="text" name="invest" id="invest" placeholder="Quanto foi investido">
                    <label for="gastos">valor investido</label>

                    <select name="method" id="metodo" class="metodo">   
                                <option value="poupanca">poupança/caixinha</option>
                                <option value="stocks">Ações</option>
                                <option value="cdb">CDB</option>
                        </select>

                    <input type="submit" value="enviar" class="submit">
                </form>
            </div>
        </div>
    </main>
    <aside>
        <div class="content_wallet">
            <div class="icon_wallet ">
                <div class="img_wallet"><img src="" alt="" srcset=""></div>
            </div>
            <p class="">Usando: </p>
            <div class="arrows">
                <div class="arrow arrow_left">
                    <button>></button>
                </div>
                <div class="arrow arrow_right">
                    <button type="button"><</button>
                </div>
            </div>
        </div>
    </aside>
</body>
<script src="../js/code.js"></script>
<script src="../js/modal.js"></script>

</html>
